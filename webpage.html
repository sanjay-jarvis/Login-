<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Secure Access</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    overflow:hidden;
    background:radial-gradient(circle,#142635,#05080c 65%,#020305);
    color:white;
    font-family:Arial,sans-serif;
}
.grid{
    position:fixed;
    inset:0;
    opacity:.2;
    background-image:
      linear-gradient(#00dfff22 1px,transparent 1px),
      linear-gradient(90deg,#00dfff22 1px,transparent 1px);
    background-size:45px 45px;
    transform:perspective(500px) rotateX(60deg) scale(2);
    transform-origin:center bottom;
}
.scene{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1200px;
}
.briefcase{
    position:absolute;
    width:430px;
    height:260px;
    bottom:10%;
    transform-style:preserve-3d;
}
.bottom{
    position:absolute;
    bottom:0;
    width:100%;
    height:175px;
    border:3px solid #45505b;
    border-radius:18px 18px 25px 25px;
    background:linear-gradient(145deg,#29313a,#080b0f);
    box-shadow:inset 0 0 35px #000,0 30px 60px #000;
}
.top{
    position:absolute;
    width:100%;
    height:105px;
    top:-85px;
    border:3px solid #45505b;
    border-radius:18px 18px 8px 8px;
    background:linear-gradient(145deg,#343d47,#080b0f);
    transform-origin:bottom;
    transform:rotateX(88deg);
    animation:open 1.4s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:.5s;
}
.top span{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    letter-spacing:5px;
    font-weight:bold;
    color:#aeb9c3;
    text-shadow:0 0 15px #00eaff;
}
.lock{
    position:absolute;
    bottom:137px;
    width:35px;
    height:38px;
    border:2px solid #8d98a4;
    border-radius:5px;
    background:linear-gradient(#707b87,#171c22);
    z-index:5;
}
.lock:after{
    content:"";
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    background:#00eaff;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 15px #00eaff;
}
.l{left:75px}.r{right:75px}

.screen{
    position:absolute;
    width:360px;
    height:230px;
    left:50%;
    bottom:100px;
    transform:translateX(-50%) translateY(180px) scale(.5);
    opacity:0;
    z-index:10;
    animation:pop 1.3s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:1.55s;
}
.screen-frame{
    position:absolute;
    inset:0;
    padding:8px;
    border-radius:18px;
    background:linear-gradient(145deg,#929ca7,#14191f 35%,#05070a);
    box-shadow:0 0 40px #00dfff55,0 30px 60px #000;
}
.display{
    width:100%;
    height:100%;
    border-radius:11px;
    background:radial-gradient(circle,#123542,#03070a 70%);
    border:2px solid #24404b;
}
.handle{
    position:absolute;
    width:110px;
    height:38px;
    left:50%;
    bottom:-27px;
    transform:translateX(-50%);
    border:8px solid #151a20;
    border-bottom:0;
    border-radius:15px 15px 0 0;
}

.login{
    position:absolute;
    width:330px;
    min-height:405px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
    padding:30px;
    border-radius:22px;
    background:#080d13ee;
    border:1px solid #00eaff55;
    box-shadow:0 0 60px #00dfff22,inset 0 0 30px #00dfff08;
    backdrop-filter:blur(20px);
    z-index:50;
    animation:loginIn 1s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:2.5s;
}
.login h1{
    text-align:center;
    letter-spacing:5px;
    margin-bottom:6px;
}
.sub{
    text-align:center;
    color:#607783;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:27px;
}
.field{margin-bottom:17px}
.field label{
    display:block;
    font-size:10px;
    letter-spacing:2px;
    color:#69818c;
    margin-bottom:7px;
}
.field input{
    width:100%;
    padding:13px;
    border-radius:9px;
    outline:none;
    border:1px solid #27353d;
    background:#05090d;
    color:white;
}
.field input:focus{
    border-color:#00eaff;
    box-shadow:0 0 15px #00eaff22;
}
button{
    width:100%;
    padding:14px;
    margin-top:4px;
    border:0;
    border-radius:9px;
    background:linear-gradient(90deg,#0085a1,#00eaff);
    color:#001014;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
}
button:hover{box-shadow:0 0 25px #00eaff66}
.switch,.forgot{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#00dfff;
    font-size:12px;
    cursor:pointer;
}
.error{
    color:#ff5d72;
    font-size:11px;
    text-align:center;
    margin-top:12px;
    min-height:15px;
}
.dashboard{
    display:none;
    position:absolute;
    z-index:100;
    width:min(500px,90vw);
    padding:40px;
    text-align:center;
    border:1px solid #00eaff55;
    border-radius:25px;
    background:#080d13ee;
    box-shadow:0 0 70px #00dfff22;
}
.dashboard h1{
    font-size:32px;
    letter-spacing:3px;
    margin-bottom:10px;
}
.dashboard p{
    color:#78909c;
    margin-bottom:25px;
}
.logout{
    background:linear-gradient(90deg,#ff3d5a,#ff7185);
}

@keyframes open{
    to{transform:rotateX(0)}
}
@keyframes pop{
    0%{opacity:0;transform:translateX(-50%) translateY(180px) scale(.5)}
    65%{opacity:1;transform:translateX(-50%) translateY(-25px) scale(1.08)}
    82%{transform:translateX(-50%) translateY(8px) scale(.97)}
    100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}
@keyframes loginIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7);filter:blur(10px)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1.05);filter:blur(0)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@media(max-width:600px){
    .briefcase{transform:scale(.7)}
    .login{width:min(330px,90vw)}
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="scene">

<div class="briefcase">
    <div class="top"><span>SECURE</span></div>
    <div class="bottom"></div>
    <div class="lock l"></div>
    <div class="lock r"></div>
    <div class="handle"></div>

    <div class="screen">
        <div class="screen-frame">
            <div class="display"></div>
        </div>
    </div>
</div>

<!-- LOGIN -->
<div class="login" id="loginBox">

<h1 id="title">ACCESS</h1>
<div class="sub" id="subtitle">SECURE SYSTEM LOGIN</div>

<form id="authForm">

<div class="field">
<label>EMAIL</label>
<input id="email" type="email" placeholder="Enter email" required>
</div>

<div class="field">
<label>PASSWORD</label>
<input id="password" type="password" placeholder="Enter password" required>
</div>

<button id="submitBtn" type="submit">INITIALIZE</button>

</form>

<div class="forgot" id="forgot">Forgot password?</div>
<div class="switch" id="switch">Create an account</div>

<div class="error" id="error"></div>

</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<h1>ACCESS GRANTED</h1>

<p>
Welcome back.<br>
<span id="userEmail"></span>
</p>

<button class="logout" id="logout">LOG OUT</button>

</div>

</div>

<script type="module">

/* =====================================================
   FIREBASE CONFIG
   Replace the values below with YOUR Firebase config.
   ===================================================== */

const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY",
    authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
    projectId: "PASTE_YOUR_PROJECT_ID",
    storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
    messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
    appId: "PASTE_YOUR_APP_ID"
};

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("authForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const error = document.getElementById("error");
const submitBtn = document.getElementById("submitBtn");
const switchBtn = document.getElementById("switch");
const forgot = document.getElementById("forgot");

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const userEmail = document.getElementById("userEmail");

let signupMode = false;

/* LOGIN / SIGNUP */

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    error.textContent = "";

    const mail = email.value.trim();
    const pass = password.value;

    try {

        submitBtn.disabled = true;
        submitBtn.textContent = "PROCESSING...";

        if (signupMode) {

            await createUserWithEmailAndPassword(
                auth,
                mail,
                pass
            );

        } else {

            await signInWithEmailAndPassword(
                auth,
                mail,
                pass
            );

        }

    } catch (err) {

        error.textContent = friendlyError(err.code);

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent =
            signupMode ? "CREATE ACCOUNT" : "INITIALIZE";

    }

});

/* SWITCH LOGIN / SIGNUP */

switchBtn.addEventListener("click", () => {

    signupMode = !signupMode;

    document.getElementById("title").textContent =
        signupMode ? "REGISTER" : "ACCESS";

    document.getElementById("subtitle").textContent =
        signupMode
        ? "CREATE SECURE ACCOUNT"
        : "SECURE SYSTEM LOGIN";

    submitBtn.textContent =
        signupMode ? "CREATE ACCOUNT" : "INITIALIZE";

    switchBtn.textContent =
        signupMode
        ? "Already have an account?"
        : "Create an account";

    forgot.style.display =
        signupMode ? "none" : "block";

    error.textContent = "";

});

/* PASSWORD RESET */

forgot.addEventListener("click", async () => {

    const mail = email.value.trim();

    if (!mail) {
        error.textContent =
            "Enter your email first.";
        return;
    }

    try {

        await sendPasswordResetEmail(auth, mail);

        error.style.color = "#00eaff";
        error.textContent =
            "Password reset email sent.";

    } catch (err) {

        error.style.color = "#ff5d72";
        error.textContent =
            friendlyError(err.code);

    }

});

/* LOGOUT */

document.getElementById("logout").addEventListener(
    "click",
    async () => {
        await signOut(auth);
    }
);

/* AUTH STATE */

onAuthStateChanged(auth, (user) => {

    if (user) {

        loginBox.style.display = "none";
        document.querySelector(".briefcase").style.display = "none";

        dashboard.style.display = "block";

        userEmail.textContent =
            user.email || "Authenticated user";

    } else {

        loginBox.style.display = "block";
        document.querySelector(".briefcase").style.display = "block";

        dashboard.style.display = "none";

    }

});

/* FRIENDLY ERRORS */

function friendlyError(code) {

    switch(code) {

        case "auth/email-already-in-use":
            return "That email is already registered.";

        case "auth/invalid-email":
            return "Please enter a valid email.";

        case "auth/weak-password":
            return "Password must be at least 6 characters.";

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/user-not-found":
            return "No account found with that email.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/too-many-requests":
            return "Too many attempts. Try again later.";

        default:
            return "Something went wrong. Please try again.";

    }

}

</script>

</body>
</html>
